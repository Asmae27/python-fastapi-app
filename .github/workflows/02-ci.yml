
name: CI

env:
  APP_NAME: FastAPI Starter

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  build:
    name: Build - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile Python files
        run: python -m compileall -q app

      - name: Check application import
        run: python -c "import app"

  test:
    name: Test - Pytest
    runs-on: ubuntu-latest
    needs: [lint, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  context:
    name: Display GitHub contexts
    runs-on: ubuntu-latest

    steps:
      - name: Display environment and GitHub information
        run: |
          echo "Application: $APP_NAME"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch or tag: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"

      - name: Display Pull Request information
        if: github.event_name == 'pull_request'
        run: |
          echo "Head branch: ${{ github.head_ref }}"
          echo "Base branch: ${{ github.base_ref }}"

      - name: Display complete GitHub context
        run: echo '${{ toJson(github) }}'
